[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinspace"
version = "1.2.1"
description = "macOS app multi-instancing and isolated environment manager"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "TwinSpace Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/nineaiyu/TwinSpace"
Repository = "https://github.com/nineaiyu/TwinSpace"
Issues = "https://github.com/nineaiyu/TwinSpace/issues"

[project.scripts]
twinspace = "twinspace.cli.main:cli"
atbclone = "twinspace.cli.main:legacy_cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff"]
gui = ["toga>=0.4.0", "requests>=2.28"]

[tool.briefcase]
project_name = "TwinSpace"
bundle = "com.twinspace"
version = "1.2.1"
url = "https://github.com/nineaiyu/TwinSpace"
author = "TwinSpace Contributors"
author_email = "nineaiyu@users.noreply.github.com"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.briefcase.app.twinspace]
formal_name = "TwinSpace"
description = "macOS App Cloning Engine"
icon = "resource/images/logo"
sources = ["src/twinspace"]
resources = ["resource/images", "docs/release"]
requires = [
    "toga>=0.4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[tool.briefcase.app.twinspace.macOS]
icon = "resource/images/logo"
requires = [
    "std-nslog",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist", "src/*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402: intentional late imports after Cocoa patches; E731/E741: style-only.
ignore = ["E402", "E731", "E741"]
