name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release packages
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release version and tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)"
            RELEASE_TAG="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION} (tag ${RELEASE_TAG})"

      - name: Import code-signing certificates
        env:
          MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "${MAC_CERTS_P12_BASE64}" ]; then
            echo "MAC_CERTS_P12_BASE64 not configured — falling back to ad-hoc signing."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo -n "${MAC_CERTS_P12_BASE64}" | base64 --decode -o "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${MAC_CERTS_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          rm -f "${CERT_PATH}"

      - name: Install provisioning profile
        env:
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "${MAC_PROVISION_PROFILE_BASE64}" ]; then
            exit 0
          fi
          PP_PATH="$RUNNER_TEMP/build.provisionprofile"
          echo -n "${MAC_PROVISION_PROFILE_BASE64}" | base64 --decode -o "${PP_PATH}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "${PP_PATH}" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Build release packages
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE_FLAGS=()
          if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_PASSWORD}" ]; then
            NOTARIZE_FLAGS+=(-n)
          fi
          bash scripts/build_release_packages.sh -v "${VERSION}" -c "${NOTARIZE_FLAGS[@]}"

      - name: Verify release artifacts
        run: |
          ls -lh dist/
          test -f "dist/TwinSpaceCli-${VERSION}-arm64.tar.gz"
          test -f "dist/TwinSpace-${VERSION}-arm64.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/TwinSpaceCli-*.tar.gz
            dist/TwinSpace-*.dmg
            dist/checksums.txt
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "TwinSpace ${RELEASE_TAG}" \
            --generate-notes \
            "dist/TwinSpaceCli-${VERSION}-arm64.tar.gz" \
            "dist/TwinSpace-${VERSION}-arm64.dmg" \
            dist/checksums.txt
