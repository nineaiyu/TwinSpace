bundle_id: cn.trae.app
app_name: Trae CN
strategy: hard_clone
app_type: electron
injection_strategy: launcher
seed_preferences: false
launch_args:
- --user-data-dir={{TWINSPACE_DATA_DIR}}/UserData
- --extensions-dir={{TWINSPACE_DATA_DIR}}/Extensions
- --disable-updates
- --skip-release-notes
environment_injection:
  HOME: '{{TWINSPACE_DATA_DIR}}/Home'
  # Trae's agent services (ai-agent / cue-server / libtoolhost) create unix
  # sockets under TMPDIR. macOS caps sun_path at 104 bytes, and the clone data
  # directory is already ~58 characters, so a nested Tmp/ path pushes
  # agent-code-toolhost-<pid>-<hash>.sock over the limit. The socket silently
  # fails to bind and every lite RPC (create_chat_session, slash_list, ...)
  # then waits for its 30-40s timeout. Keep TMPDIR on a short absolute path.
  TMPDIR: '/tmp/twinspace/{{TWINSPACE_BUNDLE_ID}}/'
  TWINSPACE_KEYCHAIN_PREFIX: '{{TWINSPACE_KEYCHAIN_PREFIX}}'
  TWINSPACE_DEVICE_UUID: '{{TWINSPACE_DEVICE_UUID}}'
  TWINSPACE_DEVICE_SERIAL: '{{TWINSPACE_DEVICE_SERIAL}}'
  TWINSPACE_DEVICE_SEED: '{{TWINSPACE_DEVICE_SEED}}'
  TWINSPACE_DEVICE_HOSTNAME: '{{TWINSPACE_DEVICE_HOSTNAME}}'
  TWINSPACE_COCOA_HOME_HOOK: '1'
  TWINSPACE_BROWSER_APP_PATH: '/Applications/Google Chrome.app'
  TWINSPACE_BROWSER_DATA_DIR: '{{TWINSPACE_ENV_DIR}}/Browser'
  TWINSPACE_OAUTH_SCHEMES: 'trae-cn'
  TWINSPACE_OAUTH_URL_MARKERS: 'login,oauth,authorize,auth,sso,callback'
symlink_whitelist:
- Library/Keychains
